[package]
name = "sandal"
version = "0.1.0"
edition = "2021"
description = "Carries ideas that worked in one place into a new problem, proposes trials, and re-reads its own conclusions as evidence arrives."

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
hex = "0.4.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "process", "time", "io-util"] }
toml = "1.2.1"

[[bin]]
name = "sandal"
path = "src/bin/sandal.rs"

[dev-dependencies]
async-trait = "0.1.92"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
trybuild = "1.0.122"
